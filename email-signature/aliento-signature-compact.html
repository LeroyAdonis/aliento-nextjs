<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aliento — email signature, compact</title>
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<style>
  /* Dark-mode switch — see the long note in aliento-signature-full.html. Same two mechanisms (prefers-color-scheme
     plus Outlook.com's [data-ogsc]), same dark tokens: surface sage-900 #1E2E24, name cream-50 #FEFCF8
     (13.93:1), title and links sage-200 #B8D5C4 (9.07:1), hairline #2D4336. Light defaults stay inline so a
     client that strips <style> still renders the correct light card. */
  @media (prefers-color-scheme: dark) {
    .sig-card      { background: #1E2E24 !important; border-color: #2D4336 !important; }
    .sig-name      { color: #FEFCF8 !important; }
    .sig-role      { color: #B8D5C4 !important; }
    .sig-rule      { border-top-color: #2D4336 !important; }
    .sig-link      { color: #B8D5C4 !important; border-bottom-color: #3A5746 !important; }
    .sig-light-img { display: none !important; }
    .sig-dark-img  { display: block !important; }
  }

  /* NARROW SCREENS: a fixed 420px card on a 320px viewport does not shrink, it overflows. Take the full width
     and let the serif name wrap onto a second line instead of being clipped. */
  @media (max-width: 480px) {
    .sig-card { width: 100% !important; }
    .sig-name { font-size: 19px !important; }
  }
  [data-ogsc] .sig-card, [data-ogsb] .sig-card { background: #1E2E24 !important; border-color: #2D4336 !important; }
  [data-ogsc] .sig-name, [data-ogsb] .sig-name { color: #FEFCF8 !important; }
  [data-ogsc] .sig-role, [data-ogsb] .sig-role { color: #B8D5C4 !important; }
  [data-ogsc] .sig-rule, [data-ogsb] .sig-rule { border-top-color: #2D4336 !important; }
  [data-ogsc] .sig-link, [data-ogsb] .sig-link { color: #B8D5C4 !important; border-bottom-color: #3A5746 !important; }
  [data-ogsc] .sig-light-img, [data-ogsb] .sig-light-img { display: none !important; }
  [data-ogsc] .sig-dark-img, [data-ogsb] .sig-dark-img { display: block !important; }
</style>
</head>
<!--
  ALIENTO — COMPACT SIGNATURE (email-safe), light + dark

  Same DNA and same live tokens as aliento-signature-full.html at a third of the weight: no mark image, no
  handwritten signature, two contact routes. Light: cream-100 card, warm-900 name (13.46:1), sage-700 title and
  links (7.55:1). Dark: sage-900 card, cream-50 name (13.93:1), sage-200 links (9.07:1).
-->
<body style="margin:0;padding:0;">
