<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aliento — email signature, full card</title>
<!-- Tell clients that this message supports both schemes. Where it is honoured, Gmail and Apple Mail stop
     force-inverting the colours and use the dark block below instead of guessing. -->
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<style>
  /* THE ONLY <style> BLOCK IN THIS SET, AND IT EXISTS FOR ONE REASON: a dark-mode switch cannot be expressed in
     inline styles. Everything the light card needs stays inline, so a client that strips <style> (or an old
     Outlook) renders the correct light card rather than nothing. This is a deliberate exception to the
     "inline styles only" rule in the html-email-design skill, and it is the reason that rule now names the
     exception.

     Two mechanisms, because no single one covers the field:
       1. @media (prefers-color-scheme: dark) — Apple Mail (macOS/iOS), Gmail apps, Thunderbird, most webmail.
       2. [data-ogsc] / [data-ogsb] — Outlook.com runs its own inversion and ignores the media query; it stamps
          those attributes on <html> when its dark theme is on.

     Dark tokens are the LIVE palette dark end (src/app/globals.css): surface sage-900 #1E2E24, text cream-50
     #FEFCF8 (13.93:1), links and icons sage-200 #B8D5C4 (9.07:1), hairline #2D4336, middot blush-600 #D9896A
     (5.26:1). Nothing here is a colour the brand does not own. */

  /* Both image variants ship in the markup. The dark one is hidden inline so a client without <style> shows the
     light card; only the dark rules below reveal it. display is the one property a media query can override
     inline, because these declarations carry !important. */
  @media (prefers-color-scheme: dark) {
    .sig-card      { background: #1E2E24 !important; border-color: #2D4336 !important; }
    .sig-name      { color: #FEFCF8 !important; }
    .sig-role      { color: #B8D5C4 !important; }
    .sig-meta      { color: #B8D5C4 !important; }
    .sig-rule      { border-top-color: #2D4336 !important; }
    .sig-link      { color: #B8D5C4 !important; border-bottom-color: #3A5746 !important; }
    .sig-dot       { color: #D9896A !important; }
    .sig-light-img { display: none !important; }
    .sig-dark-img  { display: block !important; }
    .sig-dark-img.sig-inline-img { display: inline-block !important; }
    .sig-dark-inline { display: inline-block !important; }
  }

  /* NARROW SCREENS: the descriptor is the thing that breaks first. It is a right-aligned column beside the
     wordmark, so below ~480px it either collides with the name or gets squeezed to one word per line. The fix is
     to let the card take the full width and let the descriptor fall beneath the wordmark as a normal wrapping
     line: the two cells become blocks, and the hard <br> is suppressed so it flows instead of stacking two
     forced lines. Nothing here applies at desktop width, where the design is untouched. */
  @media (max-width: 480px) {
    .sig-card { width: 100% !important; }
    .sig-brand-cell { display: block !important; width: 100% !important; }
    .sig-descriptor {
      display: block !important; width: 100% !important; text-align: left !important;
      padding: 8px 0 0 0 !important;
    }
    .sig-descriptor br { display: none !important; }
  }
  [data-ogsc] .sig-card, [data-ogsb] .sig-card { background: #1E2E24 !important; border-color: #2D4336 !important; }
  [data-ogsc] .sig-name, [data-ogsb] .sig-name { color: #FEFCF8 !important; }
  [data-ogsc] .sig-role, [data-ogsb] .sig-role { color: #B8D5C4 !important; }
  [data-ogsc] .sig-meta, [data-ogsb] .sig-meta { color: #B8D5C4 !important; }
  [data-ogsc] .sig-rule, [data-ogsb] .sig-rule { border-top-color: #2D4336 !important; }
  [data-ogsc] .sig-link, [data-ogsb] .sig-link { color: #B8D5C4 !important; border-bottom-color: #3A5746 !important; }
  [data-ogsc] .sig-dot, [data-ogsb] .sig-dot { color: #D9896A !important; }
  [data-ogsc] .sig-light-img, [data-ogsb] .sig-light-img { display: none !important; }
  [data-ogsc] .sig-dark-img, [data-ogsb] .sig-dark-img { display: block !important; }
  [data-ogsc] .sig-dark-img.sig-inline-img, [data-ogsb] .sig-dark-img.sig-inline-img { display: inline-block !important; }
</style>
</head>
<!--
  ALIENTO — FULL SIGNATURE CARD (email-safe), styled from the LIVE site, light + dark

  Structure follows the DWT signature DNA (html-email-design skill, references/dwt-signature-dna.md): one
  surface, two type voices, a hairline rule, contact as icon rows, a two-tone wordmark, full + compact.
  Styles are alientomd.com's own, taken from the rendered page and the @theme block in src/app/globals.css —
  NOT from src/lib/design-system.ts, which nothing imports.

  Light tokens: card cream-100 #FDF8F0, border warm-200 #E5E1DB, name warm-900 #2E2A26 (13.46:1), descriptor
  warm-600 #635B4E (6.33:1), title/links sage-700 #3A5746 (7.55:1), middot blush-800 #9E4A38 (5.69:1),
  hairline warm-300 #CCC6BC, link underline sage-300 #8FBD9F.
  Dark tokens: card sage-900 #1E2E24, border/hairline #2D4336, name cream-50 #FEFCF8 (13.93:1), descriptor and
  links sage-200 #B8D5C4 (9.07:1), middot blush-600 #D9896A (5.26:1).

  Type: display is Instrument Serif on the site, so the stack hands over to Georgia in a mail client; body is
  Satoshi, handed to the system UI sans.

  Images, all ink-tight with explicit dimensions and no internal padding:
    aliento-mark.png / aliento-mark-white.png          20x24
    leegale-signature.png / -white.png                122x46
    icon-{mail,phone,globe}-sage.png (light)          16x16
    icon-{mail,phone,globe}-dark.png (dark)           16x16
  Served from https://zahra.digitalwavetech.dev/email/aliento/ until the move to alientomd.com/email/.
-->
<body style="margin:0;padding:0;">

<!-- paste from here ------------------------------------------------------->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" class="sig-card"
       style="width:600px;border-collapse:collapse;background:#FDF8F0;border:1px solid #E5E1DB;">

  <!-- wordmark row: mark, two-tone name, descriptor.
       The mark is INLINE with the wordmark rather than in its own cell, which is what makes the descriptor able
       to wrap underneath on a narrow screen: two cells can only stack as blocks, an inline image inside the first
       cell does not force a line of its own. Desktop geometry is unchanged - the mark is 20px wide with a 10px
       right margin, so the wordmark still starts 30px in. -->
  <tr>
    <td style="padding:26px 26px 0 26px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;">
        <tr>
          <td class="sig-brand-cell" valign="middle"
              style="font-family:'Instrument Serif', Georgia, 'Times New Roman', serif;font-size:19px;line-height:1.2;font-weight:400;color:#2E2A26;letter-spacing:0.2px;">
            <img src="https://zahra.digitalwavetech.dev/email/aliento/aliento-mark.png" class="sig-light-img sig-inline-img"
                 width="20" height="24" alt="Aliento" border="0" data-display="inline-block"
                 style="display:inline-block;width:20px;height:24px;border:0;vertical-align:middle;margin:0 10px 0 0;">
            <img src="https://zahra.digitalwavetech.dev/email/aliento/aliento-mark-white.png" class="sig-dark-img sig-inline-img"
                 width="20" height="24" alt="" border="0" aria-hidden="true" data-display="inline-block"
                 style="display:none;width:20px;height:24px;border:0;vertical-align:middle;margin:0 10px 0 0;">
            <span style="vertical-align:middle;">Aliento<span class="sig-dot" style="color:#9E4A38;font-size:1.15em;">&middot;</span></span>
          </td>
          <td class="sig-descriptor" valign="middle" align="right"
              style="font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:9px;line-height:1.45;font-weight:600;color:#635B4E;letter-spacing:1.4px;text-transform:uppercase;padding-left:12px;">
            Preventive Care<br>&amp; Virtual Consultations
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- hairline -->
  <tr>
    <td style="padding:16px 26px 0 26px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;">
        <tr><td class="sig-rule" style="border-top:1px solid #CCC6BC;font-size:0;line-height:0;">&nbsp;</td></tr>
      </table>
    </td>
  </tr>

  <!-- handwritten signature -->
  <tr>
    <td style="padding:18px 26px 0 26px;">
      <img src="https://zahra.digitalwavetech.dev/email/aliento/leegale-signature.png" class="sig-light-img"
           width="122" height="46" alt="Leegale Adonis signature" border="0"
           style="display:block;width:122px;height:46px;border:0;">
      <img src="https://zahra.digitalwavetech.dev/email/aliento/leegale-signature-white.png" class="sig-dark-img"
           width="122" height="46" alt="" border="0" aria-hidden="true"
           style="display:none;width:122px;height:46px;border:0;">
    </td>
  </tr>

  <!-- name in the display serif, title in the brand accent -->
  <tr>
    <td class="sig-name"
        style="padding:12px 26px 0 26px;font-family:'Instrument Serif', Georgia, 'Times New Roman', serif;font-size:26px;line-height:1.15;font-weight:400;color:#2E2A26;">
      Dr Leegale Franscesca Adonis
    </td>
  </tr>
  <tr>
    <td class="sig-role"
        style="padding:8px 26px 0 26px;font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:9.5px;line-height:1.4;font-weight:600;color:#3A5746;letter-spacing:1.6px;text-transform:uppercase;">
      Public Health Medicine Specialist
    </td>
  </tr>

  <!-- contact: three icon rows, each with a light and a dark glyph -->
  <tr>
    <td style="padding:20px 26px 0 26px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;">
        <tr>
          <td width="16" valign="middle" style="width:16px;padding:0 12px 9px 0;">
            <img src="https://zahra.digitalwavetech.dev/email/aliento/icon-mail-sage.png" class="sig-light-img"
                 width="16" height="16" alt="Email" border="0" style="display:block;width:16px;height:16px;border:0;">
            <img src="https://zahra.digitalwavetech.dev/email/aliento/icon-mail-dark.png" class="sig-dark-img"
                 width="16" height="16" alt="" border="0" aria-hidden="true" style="display:none;width:16px;height:16px;border:0;">
          </td>
          <td valign="middle" style="padding:0 0 9px 0;font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:13px;line-height:1.5;">
            <a href="mailto:leegale@alientomd.com" class="sig-link"
               style="color:#3A5746;font-weight:500;text-decoration:none;border-bottom:1px solid #8FBD9F;display:inline;line-height:1.5;-webkit-text-size-adjust:none;">leegale@alientomd.com</a>
          </td>
        </tr>
        <tr>
          <td width="16" valign="middle" style="width:16px;padding:0 12px 9px 0;">
            <img src="https://zahra.digitalwavetech.dev/email/aliento/icon-phone-sage.png" class="sig-light-img"
                 width="16" height="16" alt="Phone" border="0" style="display:block;width:16px;height:16px;border:0;">
            <img src="https://zahra.digitalwavetech.dev/email/aliento/icon-phone-dark.png" class="sig-dark-img"
                 width="16" height="16" alt="" border="0" aria-hidden="true" style="display:none;width:16px;height:16px;border:0;">
          </td>
          <td valign="middle" style="padding:0 0 9px 0;font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:13px;line-height:1.5;">
            <a href="tel:+27762367921" class="sig-link"
               style="color:#3A5746;font-weight:500;text-decoration:none;border-bottom:1px solid #8FBD9F;display:inline;line-height:1.5;-webkit-text-size-adjust:none;">076 236 7921</a>
          </td>
        </tr>
        <tr>
          <td width="16" valign="middle" style="width:16px;padding:0 12px 0 0;">
            <img src="https://zahra.digitalwavetech.dev/email/aliento/icon-globe-sage.png" class="sig-light-img"
                 width="16" height="16" alt="Website" border="0" style="display:block;width:16px;height:16px;border:0;">
            <img src="https://zahra.digitalwavetech.dev/email/aliento/icon-globe-dark.png" class="sig-dark-img"
                 width="16" height="16" alt="" border="0" aria-hidden="true" style="display:none;width:16px;height:16px;border:0;">
          </td>
          <td valign="middle" style="font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:13px;line-height:1.5;">
            <a href="https://alientomd.com" class="sig-link"
               style="color:#3A5746;font-weight:500;text-decoration:none;border-bottom:1px solid #8FBD9F;display:inline;line-height:1.5;-webkit-text-size-adjust:none;">alientomd.com</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <tr><td style="padding:0 0 24px 0;font-size:0;line-height:0;">&nbsp;</td></tr>
</table>
